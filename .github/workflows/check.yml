name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scope:
    name: Determine runtime CI scope
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.scope.outputs.profiles }}
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Discover changed surface and installed profiles
        id: scope
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$PULL_REQUEST_BASE_SHA"
          if [[ -z "$base" ]]; then
            base="$PUSH_BEFORE_SHA"
          fi

          runtime=true
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            runtime=false
            if ! changed_paths="$(git diff --name-only --no-renames "$base" HEAD)"; then
              echo "failed to discover changed paths from $base to HEAD" >&2
              exit 1
            fi
            while IFS= read -r path; do
              case "$path" in
                docs/*|reports/*|.github/*.md) ;;
                */*) runtime=true; break ;;
                *.md) ;;
                *) runtime=true; break ;;
              esac
            done <<< "$changed_paths"
          fi
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"

          shopt -s nullglob
          profile_paths=(packs/*.packset.json)
          if (( ${#profile_paths[@]} == 0 )); then
            echo "no packs/*.packset.json profiles found" >&2
            exit 1
          fi
          profiles="$({
            for profile in "${profile_paths[@]}"; do
              basename "$profile" .packset.json
            done
          } | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "profiles=$profiles" >> "$GITHUB_OUTPUT"

  check:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum
      - name: Verify Go formatting and vet
        run: |
          test -z "$(gofmt -l go/cmd go/internal)"
          cd go
          go vet ./...
      - name: Whitespace hygiene
        # `git diff --check` alone inspects the working tree, which is clean on
        # a fresh checkout and so never inspected the PR's own commits. Diff
        # committed changes instead: for pull requests against the merge base,
        # for pushes against the previous branch tip (covering every commit in
        # a multi-commit push), falling back to the last commit when the
        # previous tip is unavailable (new branch or forced push).
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -n "$base" ]; then
            git diff --check "$(git merge-base "$base" HEAD)" HEAD
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -n "$before" ] && ! echo "$before" | grep -q '^0*$' && git cat-file -e "$before" 2>/dev/null; then
            git diff --check "$before" HEAD
            exit 0
          fi
          echo "No usable push base; checking the last commit."
          git diff --check HEAD~1 HEAD

  full-go-check:
    needs: scope
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.runtime == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI scope discovery
        if: ${{ needs.scope.result != 'success' }}
        run: |
          echo "CI scope discovery concluded ${{ needs.scope.result }}" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.4"
          terraform_wrapper: false
      - name: Run full Go distribution and runtime gate
        run: make check

  v2-checkpoint:
    name: Go v2 vertical-slice checkpoint
    needs: scope
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.runtime == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require successful CI scope discovery
        if: ${{ needs.scope.result != 'success' }}
        run: |
          echo "CI scope discovery concluded ${{ needs.scope.result }}" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.4"
          terraform_wrapper: false
      - name: Configure Terraform provider plugin cache
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-plugin-cache" >> "$GITHUB_ENV"
      - name: Cache Terraform provider plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packs/*/pack.json') }}
          restore-keys: |
            terraform-plugins-${{ runner.os }}-${{ runner.arch }}-
      - name: Run Go v2 vertical-slice checkpoint
        working-directory: go
        env:
          INFRAWRIGHT_V2_CHECKPOINT: "1"
        run: go test -count=1 -timeout=18m -v -run '^TestV2(BuildGoBinary.*|VerticalSliceCheckpoint)$' ./cmd/iw

  pack-profiles:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.scope.outputs.profiles) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.4"
          terraform_wrapper: false
      - name: Materialize selected pack root
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          profile="$GITHUB_WORKSPACE/packs/$PROFILE.packset.json"
          root="$RUNNER_TEMP/packs-$PROFILE"
          mkdir -p "$root"
          while IFS= read -r pack; do
            cp -R "$GITHUB_WORKSPACE/packs/$pack" "$root/$pack"
          done < <(jq -r '.packs[]' "$profile")
          while IFS= read -r shared; do
            mkdir -p "$root/_shared"
            cp -R "$GITHUB_WORKSPACE/packs/_shared/$shared" "$root/_shared/$shared"
          done < <(jq -r '.shared[]' "$profile")
          echo "INFRAWRIGHT_PACKS=$root" >> "$GITHUB_ENV"
          echo "PACK_PROFILE=$profile" >> "$GITHUB_ENV"
      - name: Validate reduced distribution
        run: make check-distribution

  pruned-pack-go-tests:
    name: Pruned Go tests (${{ matrix.profile }})
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.scope.outputs.profiles) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum
      - name: Physically prune checkout to selected profile
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/packs/$PROFILE.packset.json"
          pruned_root="$(mktemp -d "$RUNNER_TEMP/packs-$PROFILE.XXXXXX")"

          cp "$GITHUB_WORKSPACE"/packs/*.packset.json "$pruned_root/"
          while IFS= read -r pack; do
            cp -R "$GITHUB_WORKSPACE/packs/$pack" "$pruned_root/$pack"
          done < <(jq -r '.packs[]' "$profile")
          while IFS= read -r shared; do
            mkdir -p "$pruned_root/_shared"
            cp -R "$GITHUB_WORKSPACE/packs/_shared/$shared" "$pruned_root/_shared/$shared"
          done < <(jq -r '.shared[]' "$profile")

          rm -rf "$GITHUB_WORKSPACE/packs"
          mv "$pruned_root" "$GITHUB_WORKSPACE/packs"
      - name: Run Go tests against physically pruned checkout
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          results="$RUNNER_TEMP/go-test-$PROFILE.json"
          cd go
          set +e
          go test -count=1 -json ./... | tee "$results"
          status="${PIPESTATUS[0]}"
          set -e

          tests="$(jq -s '[.[] | select(.Action == "run" and .Test != null)] | length' "$results")"
          skips="$(jq -s '[.[] | select(.Action == "skip" and .Test != null)] | length' "$results")"
          executed="$((tests - skips))"
          minimum_executed_tests=2700
          maximum_full_profile_skips=15
          coverage_status=0
          if (( executed < minimum_executed_tests )); then
            echo "profile $PROFILE executed only $executed tests; minimum coverage floor is $minimum_executed_tests" >&2
            coverage_status=1
          fi
          if [[ "$PROFILE" == "full" ]] && (( skips > maximum_full_profile_skips )); then
            echo "full profile skipped $skips tests; maximum skip budget is $maximum_full_profile_skips" >&2
            coverage_status=1
          fi
          printf 'profile=%s tests=%s skips=%s executed=%s status=%s coverage_status=%s\n' \
            "$PROFILE" "$tests" "$skips" "$executed" "$status" "$coverage_status" | tee -a "$GITHUB_STEP_SUMMARY"
          if (( status != 0 )); then
            exit "$status"
          fi
          exit "$coverage_status"

  pruned-pack-go-tests-gate:
    name: Pruned pack Go tests
    needs: [scope, pruned-pack-go-tests]
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.runtime == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every physically pruned profile to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          PROFILE_TEST_RESULT: ${{ needs.pruned-pack-go-tests.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$PROFILE_TEST_RESULT" = success
